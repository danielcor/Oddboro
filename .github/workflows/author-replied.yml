# When the author of a pull request labelled `waiting-on-author` comments or
# pushes, it is our turn again: the labels move to `needs-review`
# (CONTRIBUTING.md, waiting-on-author.yml). It only changes labels. It never
# checks out or runs the pull request's code, so pull_request_target is safe
# here, and it is what lets a fork's push change labels.
name: Author replied

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  back-to-review:
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == github.event.issue.user.login
        && contains(github.event.issue.labels.*.name, 'waiting-on-author'))
      || (github.event_name == 'pull_request_target'
        && github.event.sender.login == github.event.pull_request.user.login
        && contains(github.event.pull_request.labels.*.name, 'waiting-on-author'))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Move the labels to needs-review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: gh pr edit "$NUMBER" --repo "$REPO" --remove-label waiting-on-author --remove-label stale --add-label needs-review
